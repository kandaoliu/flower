<style>
:root{
  --ink:#26342c; --muted:#6d786f; --paper:#f7f1df; --paper2:#fffaf0; --green:#38533e; --green2:#6f9159;
  --sage:#d9e3b9; --lime:#c4d85c; --gold:#e6bf55; --violet:#7c5aa7; --danger:#b85252; --line:rgba(38,52,44,.15);
  --shadow:0 10px 28px rgba(27,47,35,.14); --vh:1vh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#1f3328;color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit} button,input{touch-action:manipulation}
body{overflow:hidden;background:radial-gradient(circle at 50% 0,#617c66 0,#284133 42%,#1c2c24 100%)}
#app{height:calc(var(--vh) * 100);min-height:480px;width:100%;max-width:760px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));gap:7px;background:linear-gradient(#f5efdd,#e6ecd0)}
header{display:flex;align-items:center;gap:8px;min-height:50px;padding:2px 4px}.brand{display:flex;align-items:center;gap:8px;border:0;background:none;padding:2px 4px;min-width:0}.brand i{font-style:normal;font-size:25px;color:#4f714e}.brand strong{font-family:Georgia,"Songti SC",serif;font-size:19px;white-space:nowrap}.brand small{display:block;font-size:9px;letter-spacing:.06em;color:#738077}.resources{display:flex;gap:5px;margin-left:auto}.res{display:flex;align-items:center;gap:5px;padding:7px 9px;background:rgba(255,250,240,.82);border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:700;box-shadow:0 3px 0 rgba(35,49,41,.05)}.ico{font-size:13px}.sound{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:rgba(255,250,240,.84);font-weight:900}
main{min-height:0;overflow:auto;scrollbar-width:none;padding:1px 1px 7px}main::-webkit-scrollbar{display:none}.page{display:grid;gap:10px;animation:fade .18s ease-out}@keyframes fade{from{opacity:.25;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:rgba(255,250,240,.94);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.pad{padding:14px}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.title{font-family:Georgia,"Songti SC",serif;font-size:20px;margin:0}.sub{font-size:11px;color:var(--muted);line-height:1.55}.tag{font-size:9px;padding:4px 7px;border-radius:999px;background:#e7ecd2;color:#496047;font-weight:700}.progress{height:8px;background:rgba(49,72,54,.14);border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#c6db55,#708f51);border-radius:inherit;transition:width .3s}

rgba(28,46,36,.88),rgba(28,46,36,.26) 66%,rgba(28,46,36,.05))}.hero .copy{position:relative;z-index:1;padding:18px;max-width:62%}.hero h1{font-family:Georgia,"Songti SC",serif;font-size:29px;margin:3px 0 6px;letter-spacing:.04em}.hero .eyebrow{font-size:10px;opacity:.82}.hero .copy p{font-size:11px;line-height:1.55;margin:0 0 12px;opacity:.92}.hero .progress{background:rgba(255,255,255,.22);height:7px}.hero .progress i{background:#d0e36b}
.section-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;margin-bottom:10px}.section-head h2{font-family:Georgia,"Songti SC",serif;font-size:18px;margin:0}.section-head small{color:var(--muted);font-size:10px}.plants{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.plant{border:1px solid var(--line);border-radius:15px;background:#fffdf5;padding:8px 5px;min-height:72px;text-align:center;position:relative}.plant.locked{opacity:.35;filter:grayscale(.8)}.plant.sel{outline:2px solid #82974d;background:#eef2d5}.plant .emoji{height:36px;display:grid;place-items:center}.plant .emoji img{width:38px;height:38px;object-fit:contain;image-rendering:pixelated}.plant b{display:block;font-size:10px;margin-top:3px}.plant small{font-size:8px;color:var(--muted)}
.breed-box{margin-top:10px;background:#eeead8;border:1px dashed rgba(42,61,48,.18);border-radius:17px;padding:11px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.parent{background:#fffaf0;border:1px solid var(--line);border-radius:13px;min-height:72px;display:grid;place-items:center;text-align:center;padding:6px}.parent span{font-size:25px}.parent b{font-size:10px}.plus{font-size:20px;color:#768a59;font-weight:900}.btn{border:0;border-radius:15px;min-height:44px;padding:11px 15px;font-weight:800;box-shadow:0 4px 0 rgba(30,49,40,.10)}.primary{background:#b6cc53}.secondary{background:#e3d18d}.ghost{background:#edf0df;box-shadow:none;border:1px solid var(--line)}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.42}.wide{width:100%;margin-top:9px}
.incubating{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center;margin-top:10px;padding:10px;border-radius:16px;background:#edf0dc}.dome{height:74px;width:74px;border-radius:50% 50% 30% 30%;border:3px solid rgba(255,255,255,.84);outline:1px solid rgba(77,73,53,.18);background:radial-gradient(circle at 50% 55%,#e4ef83 0 13%,rgba(255,229,113,.22) 14% 40%,rgba(255,255,255,.54) 41%);display:grid;place-items:center;box-shadow:inset 0 -8px rgba(105,89,56,.11)}.sprout{font-size:31px;animation:bob 1.8s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.timer{font-family:ui-monospace,SFMono-Regular,monospace;font-size:21px;font-weight:800}.tiny{font-size:9px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick button{background:#fffaf0;border:1px solid var(--line);border-radius:17px;padding:12px 6px;min-height:92px}.quick .qico{font-size:23px}.quick b{display:block;font-size:11px;margin-top:5px}.quick small{display:block;font-size:8px;color:var(--muted);margin-top:3px}
.sprite{object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 4px 0 rgba(37,49,42,.12))}.florans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.floran{background:#fffaf0;border:1px solid var(--line);border-radius:16px;padding:7px;text-align:center;position:relative;min-width:0}.floran img{width:100%;aspect-ratio:1/1}.floran b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.floran small{font-size:8px;color:var(--muted)}.floran.rare:after{content:"✦";position:absolute;right:7px;top:6px;color:#b67c28}.floran.selected{outline:2px solid #849849;background:#edf2d3}.floran.locked{filter:grayscale(1);opacity:.22}.badge{position:absolute;left:6px;top:6px;font-size:8px;background:rgba(255,250,240,.9);padding:3px 5px;border-radius:999px}
.squad-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.slot{aspect-ratio:.82;border:1px dashed rgba(40,58,46,.23);border-radius:16px;background:#f5f0e2;display:grid;place-items:center;position:relative}.slot img{width:92%;height:92%}.slot span{font-size:22px;color:#9b9c8e}.slot em{position:absolute;bottom:5px;right:5px;background:#4c664c;color:white;font-style:normal;font-size:8px;padding:2px 5px;border-radius:8px}

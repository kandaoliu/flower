function tone(f,d,vol,type){if(!state.sound||!audio)return;try{var o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(vol||.02,t);g.gain.exponentialRampToValueAtTime(.0001,t+(d||.06));o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+(d||.06)+.02)}catch(e){}}
function sfx(n){ensureAudio();if(n==='tap')tone(520,.035,.016);if(n==='breed'){tone(440,.08,.025,'triangle');setTimeout(function(){tone(660,.09,.02,'triangle')},80)}if(n==='shot')tone(760,.025,.009);if(n==='hit')tone(150,.04,.009,'sawtooth');if(n==='win'){tone(660,.16,.03,'triangle');setTimeout(function(){tone(880,.18,.025,'triangle')},120)}}
function startBgm(){clearInterval(bgm);if(!audio||!state.sound)return;var notes=[220,277,330,370,330,277,247,277],i=0;bgm=setInterval(function(){if(!state.sound)return;tone(notes[i++%notes.length],.13,.005,'triangle')},520)}

function renderLab(){
 var stage=currentStage(), pcts=Math.min(100,state.purify); var plants=Object.keys(PLANTS).map(function(id){var unlocked=state.plants.indexOf(id)>=0;return '<button class="plant '+(!unlocked?'locked':'')+(state.parents.indexOf(id)>=0?' sel':'')+'" data-plant="'+id+'" '+(!unlocked?'disabled':'')+'><div class="emoji"><img src="'+PLANTS[id].icon+'" alt=""></div><b>'+PLANTS[id].name+'</b><small>'+PLANTS[id].trait+'</small></button>'}).join('');

}
function bindLab(){

 var breedBtn=$('[data-action="breed"]');if(breedBtn)breedBtn.addEventListener('click',startBreed);var sp=$('[data-action="speed-breed"]');if(sp)sp.addEventListener('click',function(){if(state.essence<1){toast('精华不足');return}state.essence--;state.breed.end=Date.now();save();finishBreed(true)});
 $$('[data-tabgo]').forEach(function(b){b.addEventListener('click',function(){state.tab=b.getAttribute('data-tabgo');save();render()})});
}
function startBreed(){if(state.parents.length<2||state.breed)return;if(state.leaves<20){toast('叶能不足');return}ensureAudio();sfx('breed');state.leaves-=20;var a=state.parents[0],b=state.parents[1],result=breedResult(a,b);state.breed={a:a,b:b,result:result,end:Date.now()+8000};state.parents=[];save();renderLab()}
function finishBreed(speed){if(!state.breed)return;var id=state.breed.result;state.breed=null;state.florans[id]=(state.florans[id]||0)+1;save();showReveal(id,speed)}
function showReveal(id,speed){var f=FLORANS[id];sfx('breed');modal.innerHTML='<div class="modal-wrap"><div class="modal"><div class="row between"><span class="tag">'+(f.rarity==='常见'?'新花人':'稀有发现')+'</span><span class="tiny">'+f.role+'</span></div><div class="reveal"><div class="glow">'+sprite(id)+'</div></div><h2>'+f.name+'</h2><p><b>'+f.skill+'</b><br>它已经加入你的花人图鉴，可以编入阵容参与净化战斗。</p><div class="modal-actions"><button class="btn ghost" data-close>继续培育</button><button class="btn primary" data-gosquad>加入阵容</button></div></div></div>';

}
function renderCollection(){var cards=ALL.map(function(id){var f=FLORANS[id],un=state.florans[id]>0;return '<div class="floran '+(!un?'locked':'')+(f.rarity!=='常见'?' rare':'')+'">'+(un?sprite(id):'<div style="aspect-ratio:1/1;display:grid;place-items:center;font-size:36px">?</div>')+'<b>'+(un?f.name:'未发现')+'</b><small>'+(un?f.skill:'继续培育以发现')+'</small>'+(un?'<span class="badge">×'+state.florans[id]+'</span>':'')+'</div>'}).join('');screen.innerHTML='<section class="page"><div class="card pad"><div class="section-head"><div><h2>花人图鉴</h2><small>每一种花人，都来自植物之间不同的可能。</small></div><span class="tag">'+Object.keys(state.florans).filter(function(k){return state.florans[k]>0}).length+' / '+ALL.length+'</span></div><div class="florans">'+cards+'</div></div></section>'}
function renderSquad(){var slots=state.squad.map(function(id,i){return '<button class="slot" data-slot="'+i+'">'+(id?sprite(id):'<span>＋</span>')+(id?'<em>'+FLORANS[id].role+'</em>':'')+'</button>'}).join('');var owned=Object.keys(state.florans).filter(function(id){return state.florans[id]>0}).map(function(id){var f=FLORANS[id],sel=state.squad.indexOf(id)>=0;return '<button class="floran '+(sel?'selected':'')+(f.rarity!=='常见'?' rare':'')+'" data-unit="'+id+'">'+sprite(id)+'<b>'+f.name+'</b><small>'+f.skill+'</small></button>'}).join('');screen.innerHTML='<section class="page"><div class="card pad"><div class="section-head"><div><h2>出战阵容</h2><small>最多选择 4 名花人。轻点花人即可加入或移除。</small></div><span class="tag">'+state.squad.filter(Boolean).length+' / 4</span></div><div class="squad-slots">'+slots+'</div><div class="florans">'+owned+'</div><button class="btn primary wide" data-action="go-map">前往花之大陆</button></div></section>';$$('[data-unit]').forEach(function(b){b.addEventListener('click',function(){var id=b.getAttribute('data-unit'),idx=state.squad.indexOf(id);if(idx>=0){state.squad[idx]=null}else{var empty=state.squad.indexOf(null);if(empty<0){toast('阵容已满');return}state.squad[empty]=id}sfx('tap');save();renderSquad()})});$('[data-action="go-map"]').onclick=function(){state.tab='map';save();render()}}
function renderMap(){var nodes='';for(var i=0;i<4;i++){var cls=(state.done.indexOf(i+1)>=0?'done':(i+1===state.maxStage?'now':(i+1>state.maxStage?'lock':'')));nodes+='<button class="node '+cls+'" style="left:'+(12+i*22)+'%;bottom:'+(30+(i%2)*12)+'px">'+(cls==='lock'?'🔒':(cls==='done'?'✓':'⚔'))+'</button>'}var stages=STAGES.map(function(s){var lock=s.id>state.maxStage,now=s.id===state.maxStage;return '<div class="stage '+(lock?'locked':'')+(now?' now':'')+'"><div class="num">'+s.id+'</div><div><strong>'+s.name+'</strong><small>'+s.desc+'</small></div><div>'+(lock?'🔒':(state.done.indexOf(s.id)>=0?'✓':'›'))+'</div></div>'}).join('');screen.innerHTML='<section class="page"><div class="card map-hero"><div class="map-copy"><div class="tag" style="display:inline-block">花之大陆</div><h1 class="title" style="margin-top:8px;font-size:27px">风之丘陵</h1><p class="sub" style="max-width:60%">净化进度 '+state.purify+'%</p><div class="progress" style="width:52%"><i style="width:'+state.purify+'%"></i></div></div><div class="route"></div>'+nodes+'</div><div class="card pad"><div class="section-head"><div><h2>净化路线</h2><small>当前可挑战：'+currentStage().name+'</small></div></div><div class="stage-list">'+stages+'</div><button class="btn primary wide" data-action="battle">进入当前关卡</button></div></section>';$('[data-action="battle"]').onclick=function(){startBattle(currentStage())}}
function startBattle(stage){if(!state.squad.filter(Boolean).length){toast('先编入至少一名花人');state.tab='squad';render();return}battle={stage:stage,placed:{},selected:null,started:false,paused:false,done:false,wave:0,totalWaves:stage.waves,garden:5,enemies:[],spawnLeft:0,spawnTimer:0,units:[],last:0,speed:1};nav.style.display='none';renderBattle()}
function renderBattle(){nav.style.display='none';var hand=state.squad.filter(Boolean).map(function(id){return '<button class="unit-card" data-pick="'+id+'">'+sprite(id)+'<small>'+FLORANS[id].name.replace('花人','')+'</small></button>'}).join('');screen.innerHTML='<section class="battle-page"><div class="battle-top"><div><b>'+battle.stage.name+'</b><small>净化变异虫群 · 守护花原</small></div><div class="battle-controls"><button data-speed>×'+battle.speed+'</button><button data-pause>Ⅱ</button><button data-exit>←</button></div></div><div class="field" id="field"><div class="path"></div><div class="crystals"></div><div class="wave-pill">第 <span id="waveNo">0</span>/'+battle.totalWaves+' 波</div><div class="garden-hp">花园 ♥ <span id="gardenHp">'+battle.garden+'</span>/5</div><div class="grid" id="grid">'+Array.from({length:9},function(_,i){return '<button class="tile" data-tile="'+i+'"></button>'}).join('')+'</div><div class="battle-hint" id="battleHint">先选择下方花人，再点草地格子完成布阵。</div></div><div class="dock"><div class="hand">'+hand+'</div><button class="btn primary start" data-start>开始</button></div></section>';bindBattle();drawPlaced();}
function bindBattle(){
 $$('[data-pick]').forEach(function(b){b.addEventListener('click',function(){if(battle.started)return;battle.selected=b.getAttribute('data-pick');$$('[data-pick]').forEach(function(x){x.classList.toggle('sel',x===b)});$$('.tile').forEach(function(t){t.classList.add('placeable')});sfx('tap')})});
 $$('[data-tile]').forEach(function(t){t.addEventListener('click',function(){if(battle.started||!battle.selected)return;var idx=+t.getAttribute('data-tile');var already=Object.keys(battle.placed).some(function(k){return battle.placed[k]===battle.selected});if(already){toast('同一名花人只能放置一次');return}if(battle.placed[idx])return;battle.placed[idx]=battle.selected;battle.selected=null;renderBattle()})});
 $('[data-start]').onclick=function(){if(Object.keys(battle.placed).length<1){toast('至少放置一名花人');return}battle.started=true;$('#battleHint').classList.add('hide');battle.last=performance.now();startNextWave();requestAnimationFrame(loopBattle)};
 $('[data-pause]').onclick=function(){battle.paused=!battle.paused;this.textContent=battle.paused?'▶':'Ⅱ'};

}
function tileCenter(idx){var col=idx%3,row=Math.floor(idx/3);return {x:.05+.64*((col+.5)/3),y:.18+.67*((row+.5)/3)}}
function drawPlaced(){if(!battle)return;var field=$('#field');if(!field)return;$$('.unit',field).forEach(function(x){x.remove()});Object.keys(battle.placed).forEach(function(k){var idx=+k,id=battle.placed[k],p=tileCenter(idx),d=document.createElement('div');d.className='unit';d.setAttribute('data-unitid',id);d.style.left=(p.x*100)+'%';d.style.top=(p.y*100)+'%';d.innerHTML=sprite(id);field.appendChild(d)});}
function startNextWave(){if(!battle||battle.done)return;if(battle.wave>=battle.totalWaves){if(!battle.enemies.length)winBattle();return}battle.wave++;battle.spawnLeft=3+battle.wave*2;battle.spawnTimer=.15;var w=$('#waveNo');if(w)w.textContent=battle.wave}
function pathPos(t){var pts=[[.90,.03],[.80,.17],[.92,.31],[.72,.43],[.90,.58],[.76,.70],[.88,.84],[.78,.98]];var seg=(pts.length-1)*t,i=Math.min(pts.length-2,Math.floor(seg)),u=seg-i;return {x:pts[i][0]+(pts[i+1][0]-pts[i][0])*u,y:pts[i][1]+(pts[i+1][1]-pts[i][1])*u}}
function spawnEnemy(){var base=80*battle.stage.diff*(1+battle.wave*.18);battle.enemies.push({id:'e'+Date.now()+Math.random(),hp:base,max:base,t:0,speed:(.045+.008*battle.stage.diff)*(0.88+Math.random()*.25),dead:false,el:null})}
function loopBattle(ts){if(!battle||battle.done||!battle.started)return;var dt=Math.min(.05,(ts-battle.last)/1000||0);battle.last=ts;if(!battle.paused)updateBattle(dt*battle.speed);requestAnimationFrame(loopBattle)}
function updateBattle(dt){var field=$('#field');if(!field)return;if(battle.spawnLeft>0){battle.spawnTimer-=dt;if(battle.spawnTimer<=0){spawnEnemy();battle.spawnLeft--;battle.spawnTimer=.62/battle.speed}}
 battle.enemies.forEach(function(e){if(e.dead)return;e.t+=e.speed*dt;if(e.t>=1){e.dead=true;battle.garden--;sfx('hit');var g=$('#gardenHp');if(g)g.textContent=battle.garden;if(battle.garden<=0){loseBattle();return}} if(!e.el&&!e.dead){var d=document.createElement('div');d.className='enemy';d.innerHTML='<div class="hp"><i></i></div><img src="assets/bug.png" alt="变异甲虫">';field.appendChild(d);e.el=d} if(e.el&&!e.dead){var p=pathPos(e.t);e.el.style.left=(p.x*100)+'%';e.el.style.top=(p.y*100)+'%';var bar=e.el.querySelector('.hp i');bar.style.width=Math.max(0,e.hp/e.max*100)+'%'}});
 battle.enemies=battle.enemies.filter(function(e){if(e.dead){if(e.el)e.el.remove();return false}return true});
 if(!battle.cooldowns)battle.cooldowns={};Object.keys(battle.placed).forEach(function(k){var id=battle.placed[k],f=FLORANS[id],cd=battle.cooldowns[k]||0;cd-=dt;if(cd<=0){var u=tileCenter(+k),best=null,bd=999;battle.enemies.forEach(function(e){var p=pathPos(e.t),dx=p.x-u.x,dy=p.y-u.y,d=Math.sqrt(dx*dx+dy*dy);if(d<f.range&&d<bd){best=e;bd=d}});if(best){attackUnit(+k,id,best);cd=f.cool}}battle.cooldowns[k]=cd});
 if(battle.spawnLeft===0&&!battle.enemies.length){setTimeout(function(){if(battle&&battle.started&&!battle.done)startNextWave()},360)}
}
function attackUnit(idx,id,e){var f=FLORANS[id],dmg=f.atk*(.9+Math.random()*.2);if(id==='sunflower')dmg*=.75;if(id==='windrose')dmg*=1.15;e.hp-=dmg;sfx('shot');var unit=$('.unit[data-unitid="'+id+'"]');if(unit){unit.classList.remove('attack');void unit.offsetWidth;unit.classList.add('attack')}if(e.el&&unit){var field=$('#field'),fr=field.getBoundingClientRect(),ur=unit.getBoundingClientRect(),er=e.el.getBoundingClientRect(),s=document.createElement('i');s.className='shot';s.style.left=(ur.left-fr.left+ur.width/2)+'px';s.style.top=(ur.top-fr.top+ur.height/2)+'px';field.appendChild(s);var dx=(er.left-fr.left+er.width/2)-(ur.left-fr.left+ur.width/2),dy=(er.top-fr.top+er.height/2)-(ur.top-fr.top+ur.height/2);requestAnimationFrame(function(){s.style.transform='translate('+dx+'px,'+dy+'px)';s.style.opacity='0'});setTimeout(function(){s.remove()},210)}if(e.hp<=0){e.dead=true;state.leaves+=3;sfx('hit')}}
function winBattle(){if(!battle||battle.done)return;battle.done=true;sfx('win');var s=battle.stage;if(state.done.indexOf(s.id)<0){state.done.push(s.id);state.purify=Math.min(100,state.purify+25);if(s.reward&&state.plants.indexOf(s.reward)<0)state.plants.push(s.reward);if(s.id<STAGES.length)state.maxStage=Math.max(state.maxStage,s.id+1)}state.leaves+=35;state.essence+=1;save();var reward=s.reward?('<p><b>解锁新植物：'+PLANTS[s.reward].name+'</b><br>它将带来新的花人组合。</p>'):'<p>获得叶能与培育精华，可以继续强化你的花人阵容。</p>';modal.innerHTML='<div class="modal-wrap"><div class="modal"><span class="tag">区域净化完成</span><h2 style="margin-top:8px">花又开回来了。</h2>'+reward+'<div class="modal-actions"><button class="btn primary" data-ok>返回大陆</button></div></div></div>';$('[data-ok]').onclick=function(){modal.innerHTML='';battle=null;nav.style.display='grid';state.tab='map';save();render()}}
function loseBattle(){if(!battle||battle.done)return;battle.done=true;modal.innerHTML='<div class="modal-wrap"><div class="modal"><span class="tag">防线失守</span><h2 style="margin-top:8px">再调整一下阵容吧。</h2><p>不同花人的射程和攻击节奏不同，重新布阵就能再试一次。</p><div class="modal-actions"><button class="btn ghost" data-squad>调整阵容</button><button class="btn primary" data-retry>重试</button></div></div></div>';$('[data-squad]').onclick=function(){modal.innerHTML='';battle=null;nav.style.display='grid';state.tab='squad';render()};$('[data-retry]').onclick=function(){modal.innerHTML='';startBattle(battle.stage)}}
nav.addEventListener('click',function(e){var b=e.target.closest('button[data-tab]');if(!b)return;ensureAudio();sfx('tap');battle=null;state.tab=b.getAttribute('data-tab');save();render()});document.addEventListener('click',function(e){var b=e.target.closest('[data-action="lab"]');if(b){battle=null;state.tab='lab';save();render()}});soundBtn.addEventListener('click',function(){state.sound=!state.sound;if(!state.sound)stopBgm();else ensureAudio();save()});document.addEventListener('touchstart',ensureAudio,{once:true,passive:true});document.addEventListener('mousedown',ensureAudio,{once:true});
updateTop();render();
})();

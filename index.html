tems:end center;background:radial-gradient(circle at 50% 58%,rgba(234,211,101,.44),transparent 52%);position:relative;overflow:hidden}.reveal-art:before{content:"";position:absolute;inset:8% 5%;background:radial-gradient(circle,#fff7c5 0 3%,transparent 4%) 0 0/28px 28px;opacity:.35;animation:spark 2s linear infinite}@keyframes spark{50%{transform:translateY(-4px);opacity:.8}}.reveal-art img{width:100%;height:235px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 9px 0 rgba(47,50,37,.12));position:relative}.reveal-copy h2{font-family:Georgia,"Songti SC",serif;font-size:24px;margin:3px 0}.rarity{color:#a26c22;font-size:9px;font-weight:900}.trait-list{display:grid;gap:6px;margin:9px 0}.trait-item{background:#fffaf0;border:1px solid var(--line);border-radius:11px;padding:7px}.trait-item b{font-size:9px}.trait-item small{font-size:7px;color:var(--muted);display:block;margin-top:2px}

/* battle */

n:absolute;left:9%;top:3%;width:60%;height:94%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);gap:3px;z-index:2}.battle-tile{border:1px dashed rgba(53,80,53,.18);background:rgba(255,255,255,.05);border-radius:8px}.battle-tile.open{background:rgba(238,244,202,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}.battle-tile:disabled{opacity:.6}.unit{position:absolute;width:15%;height:24%;z-index:5;transform:translate(-50%,-50%);pointer-events:none}.unit img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 4px 0 rgba(41,50,39,.14))}.unit .u-hp{position:absolute;left:15%;right:15%;bottom:4%;height:4px;background:#3b4d3e;border-radius:9px;overflow:hidden}.unit .u-hp i{display:block;height:100%;background:#bddb69}.unit.attack img{animation:atk .2s ease}@keyframes atk{50%{transform:translateX(5px) scale(1.03)}}.unit.hurt img{animation:hurt .18s ease}@keyframes hurt{50%{filter:brightness(1.8) saturate(.5)}}.enemy{position:absolute;width:11%;height:18%;z-index:4;transform:translate(-50%,-50%);transition:filter .18s}.enemy img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 3px 0 rgba(37,38,35,.14))}.enemy .e-hp{position:absolute;left:5%;right:5%;top:-2px;height:4px;background:#3d3f3f;border-radius:9px;overflow:hidden}.enemy .e-hp i{display:block;height:100%;background:#d76562}.enemy.slow{filter:hue-rotate(170deg) saturate(.6)}.projectile{position:absolute;width:8px;height:8px;border-radius:50%;background:#f5e78b;box-shadow:0 0 8px #fff9bf;z-index:7;pointer-events:none;transition:transform .18s linear,opacity .18s}.battle-hud{position:absolute;left:8px;right:8px;top:7px;display:flex;align-items:center;gap:5px;z-index:10;pointer-events:none}.hud-pill{background:rgba(255,250,240,.9);border:1px solid rgba(36,52,43,.12);border-radius:999px;padding:5px 8px;font-size:8px;font-weight:900}.hud-pill.energy{margin-left:auto}.wavebar{position:absolute;left:9px;right:9px;bottom:7px;height:8px;border-radius:99px;background:rgba(36,52,43,.22);z-index:10;overflow:hidden}.wavebar i{display:block;height:100%;background:#d9df70;transition:width .2s}.battle-dock{background:rgba(255,250,240,.96);border:1px solid var(--line);border-radius:17px;padding:7px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}.hand{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.hand-card{border:1px solid var(--line);border-radius:12px;background:#fffaf0;padding:3px;position:relative;min-height:66px;overflow:hidden}.hand-card img{width:100%;height:48px;object-fit:contain;image-rendering:pixelated}.hand-card b{position:absolute;left:4px;bottom:3px;font-size:7px;background:rgba(255,250,240,.88);border-radius:7px;padding:2px 4px}.hand-card em{position:absolute;right:4px;bottom:3px;font-style:normal;font-size:7px;color:#476345;background:#e6edd2;border-radius:7px;padding:2px 4px}.hand-card.selected{outline:2px solid #d8b849}.hand-card.disabled{filter:grayscale(.65);opacity:.42}.battle-action{width:66px;border:0;border-radius:14px;background:#c9d85c;font-weight:900;font-size:9px}.battle-action.pause{background:#e7e3d4}

(function(){

 sun:{name:'曜葵',art:'sun_v3.png',role:'供能',roleIcon:'☀',bio:'向日葵谱系的明朗花人。灯籽会持续积蓄芽能，让防线更快成形。',cost:48,hp:150,atk:8,cool:1.25,range:.42,skill:'日光蓄能'},
 dandelion:{name:'绒风',art:'dandelion_v3.png',role:'速射',roleIcon:'➶',bio:'蒲公英谱系的风行花人。轻盈、快速，擅长在远处连续压制虫群。',cost:54,hp:118,atk:13,cool:.44,range:.67,skill:'风种连射'},
 cactus:{name:'棘垒',art:'cactus_v3.png',role:'守护',roleIcon:'◈',bio:'仙人掌谱系的防御花人。厚实储水组织与木盾让它成为最可靠的前排。',cost:66,hp:380,atk:8,cool:1.05,range:.14,skill:'反刺坚守'},

 lily:{name:'白露',art:'lily_v3.png',role:'治疗',roleIcon:'✚',bio:'百合谱系的净化花人。花露可修复同伴，也能稳定被污染的土地。',cost:60,hp:142,atk:7,cool:1.45,range:.43,skill:'净露疗愈'}

  {name:'菌根共生',icon:'❧',desc:'接入共生菌网络，增强感知与辅助能力。',key:'support',mutation:1}
 ]},
 {name:'开花期',story:'开花前最后一次环境刺激，可能触发罕见表达。',options:[

  {name:'昼夜温差',icon:'☾',desc:'制造温差，让花人获得更敏锐的节律。',key:'speed',mutation:2},
  {name:'净水灌溉',icon:'♧',desc:'降低污染残留，让共生组织更稳定。',key:'support',mutation:0}
 ]}
];
var STAGES=[
 {id:1,name:'花圃边缘',desc:'小型蚜虫正在扩散。',waves:3,scale:.82,reward:null,enemies:['蚜虫','幼甲虫']},
 {id:2,name:'风之丘陵',desc:'甲虫开始形成硬壳群落。',waves:3,scale:1,reward:'cactus',enemies:['甲虫','飞蚜']},
 {id:3,name:'雾铃湿地',desc:'湿地虫群会减缓花人的攻击节奏。',waves:4,scale:1.2,reward:'bell',enemies:['泥甲','飞蚜','孢虫']},
 {id:4,name:'白露庭园',desc:'污染核心正在侵蚀净化带。',waves:4,scale:1.4,reward:'lily',enemies:['重甲虫','孢虫','巢母']}
];
var DEFAULT={tab:'lab',leaves:230,essence:4,sound:true,plants:['rose','sun','dandelion'],mother:'rose',donor:'dandelion',incubation:null,roster:[],squad:[],done:[],maxStage:1,purify:0,selectedFloran:null};
function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(){return 'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function mkFloran(species,donor,temper,rare,name){return {id:uid(),species:species,donor:donor||species,temper:temper||'power',rare:!!rare,level:1,xp:0,name:name||SPECIES[species].name}}
var state=load();
var labPickMode='mother';
if(!state.roster||!state.roster.length){state.roster=[mkFloran('rose','rose','power',false,'绯蔷·一号'),mkFloran('rose','sun','vital',false,'绯蔷·二号'),mkFloran('sun','sun','support',false,'曜葵·一号'),mkFloran('dandelion','dandelion','speed',false,'绒风·一号')];state.squad=state.roster.map(function(x){return x.id}).slice(0,4);state.selectedFloran=state.roster[0].id;save()}
function load(){try{var x=localStorage.getItem('floran_v3');if(x){var p=JSON.parse(x),d=clone(DEFAULT);Object.keys(p).forEach(function(k){d[k]=p[k]});return d}}catch(e){}return clone(DEFAULT)}
function save(){try{localStorage.setItem('floran_v3',JSON.stringify(state))}catch(e){}}
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toastEl._t);toastEl._t=setTimeout(function(){toastEl.classList.remove('show')},1800)}
function plantImg(id){return '<img src="'+AS+PLANTS[id].icon+'" alt="'+PLANTS[id].name+'">'}
function art(species,cls){return '<img class="'+(cls||'')+'" src="'+AS+SPECIES[species].art+'" alt="'+SPECIES[species].name+'">'}
function floranById(id){return state.roster.find(function(f){return f.id===id})||null}
function stats(f){var s=SPECIES[f.species],o={hp:s.hp,atk:s.atk,cool:s.cool,range:s.range};var d=DONOR_TRAITS[f.donor],t=TEMPER[f.temper];if(d.stat==='atk')o.atk*=d.mult;if(d.stat==='hp')o.hp*=d.mult;if(d.stat==='speed')o.cool*=d.mult;if(t.stat==='atk')o.atk*=t.mult;if(t.stat==='hp')o.hp*=t.mult;if(t.stat==='speed')o.cool*=t.mult;if(t.stat==='range')o.range*=t.mult;if(f.rare){o.atk*=1.08;o.hp*=1.08}return o}
function updateTop(){$('#leafCount').textContent=Math.floor(state.leaves);$('#essCount').textContent=state.essence;soundBtn.textContent=state.sound?'♪':'×';$$('#nav button').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===state.tab)})}
/* audio */
var ac=null,bgmTimer=null;
function ensureAudio(){if(!state.sound)return;try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();if(!bgmTimer)startBgm()}catch(e){}}
function tone(freq,dur,type,vol,delay){if(!state.sound)return;ensureAudio();if(!ac)return;var o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime+(delay||0);o.type=type||'sine';o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(vol||.025,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g);g.connect(ac.destination);o.start(now);o.stop(now+dur+.03)}
function sfx(k){if(k==='tap')tone(520,.07,'triangle',.018);if(k==='breed'){tone(520,.12,'sine',.025);tone(660,.15,'sine',.025,.08);tone(820,.2,'sine',.02,.16)}if(k==='shot')tone(700,.05,'triangle',.012);if(k==='hit')tone(150,.06,'square',.015);if(k==='win'){tone(523,.2,'sine',.025);tone(659,.2,'sine',.025,.14);tone(784,.35,'sine',.03,.28)}if(k==='place')tone(380,.08,'triangle',.02)}
function startBgm(){if(!state.sound||!ac)return;var seq=[392,440,523,440,349,392,494,392],i=0;bgmTimer=setInterval(function(){tone(seq[i%seq.length],.5,'sine',.006);i++},650)}
function stopBgm(){if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null}}
/* render */
function render(){updateTop();nav.style.display=state.tab==='battle'?'none':'grid';if(state.tab==='lab')renderLab();else if(state.tab==='florans')renderFlorans();else if(state.tab==='map')renderMap();else if(state.tab==='index')renderIndex()}
function renderLab(){var inc=state.incubation;var incHtml='';if(inc){var left=Math.max(0,inc.end-Date.now());if(left<=0){incHtml='<div class="incubator"><div class="dome"><span>✦</span></div><div><b>培育完成</b><div class="sub">新的花人正在培养舱里等你。</div><div class="care-preview"><span>'+PLANTS[inc.mother].name+'谱系</span><span>'+DONOR_TRAITS[inc.donor].name+'</span></div></div><button class="btn secondary" data-reveal>揭晓</button></div>'}else{incHtml='<div class="incubator"><div class="dome"><span>🌱</span></div><div><b>正在培育</b><div class="timer" id="incTimer">'+fmt(left)+'</div><div class="care-preview"><span>'+PLANTS[inc.mother].name+'谱系</span><span>'+TEMPER[inc.temper].name+'</span></div></div><button class="btn ghost" data-fast>精华加速</button></div>'}}
 var chips=Object.keys(PLANTS).map(function(id){var p=PLANTS[id],lock=state.plants.indexOf(id)<0,ca=state.mother===id?' sel-a':'',cb=state.donor===id?' sel-b':'';return '<button class="plant-chip'+(lock?' locked':'')+ca+cb+'" '+(lock?'disabled':'')+' data-plant="'+id+'">'+plantImg(id)+'<b>'+p.name+'</b><small>'+p.gene+'</small></button>'}).join('');
 screen.innerHTML='<section class="page"><div class="card lab-hero"><div class="lab-copy"><span class="eyebrow">植物科学家 · 温室 07</span><h1>不是抽卡，是育种。</h1><p>母本决定花人的主体谱系，供体提供可遗传特性；你在生长阶段的选择，会继续塑造它。</p><div class="lab-mini"><span>① 选亲本</span><span>② 调环境</span><span>③ 看表达</span></div></div></div><div class="card pad"><div class="section-head"><div><h2>组合亲本</h2><small>红框：母本 · 绿框：供体</small></div><span class="tag">可控遗传</span></div><div class="parent-grid"><div class="gene-slot filled">'+plantImg(state.mother)+'<div><b>'+PLANTS[state.mother].name+'母本</b><small>决定外形与基础能力</small></div></div><div class="cross">×</div><div class="gene-slot filled">'+plantImg(state.donor)+'<div><b>'+PLANTS[state.donor].name+'供体</b><small>遗传 '+PLANTS[state.donor].gene+'</small></div></div></div><div class="plant-strip">'+chips+'</div><div class="slot-legend"><span><i class="a"></i>第一次点选 = 母本</span><span><i class="b"></i>第二次点选 = 供体</span></div><button class="btn primary wide" data-breed '+(inc?'disabled':'')+'>进入三阶段育种</button>'+incHtml+'</div><div class="quick-cards"><button class="quick" data-goto="florans"><span class="qi">❀</span><strong>花人个体</strong><small>查看遗传与性格</small></button><button class="quick" data-goto="map"><span class="qi">⚔</span><strong>净化战线</strong><small>把培育结果用于战斗</small></button><button class="quick" data-goto="index"><span class="qi">▤</span><strong>谱系图鉴</strong><small>解锁花之大陆植物</small></button></div></section>';
 $$('[data-plant]').forEach(function(b){b.onclick=function(){var id=b.getAttribute('data-plant');if(labPickMode==='mother'){state.mother=id;if(state.donor===id){var alt=state.plants.find(function(x){return x!==id});if(alt)state.donor=alt}labPickMode='donor';toast('母本：'+PLANTS[id].name+'，再选择供体')}else{if(id===state.mother){toast('供体需要与母本不同');return}state.donor=id;labPickMode='mother';toast('供体：'+PLANTS[id].name)}save();renderLab()}});$('[data-breed]').onclick=function(){if(state.mother===state.donor){toast('请选择不同植物作为亲本');return}openBreeding(0,{mother:state.mother,donor:state.donor,scores:{power:0,vital:0,speed:0,support:0},mutation:0,choices:[]})};$$('[data-goto]').forEach(function(b){b.onclick=function(){state.tab=b.getAttribute('data-goto');save();render()}});var fast=$('[data-fast]');if(fast)fast.onclick=function(){if(state.essence<1){toast('培育精华不足');return}state.essence--;state.incubation.end=Date.now();save();renderLab();sfx('breed')};var rev=$('[data-reveal]');if(rev)rev.onclick=function(){revealIncubation()};if(inc&&inc.end>Date.now()){clearInterval(renderLab._timer);renderLab._timer=setInterval(function(){var t=$('#incTimer');if(!t){clearInterval(renderLab._timer);return}var l=Math.max(0,state.incubation.end-Date.now());t.textContent=fmt(l);if(l<=0){clearInterval(renderLab._timer);renderLab()}},1000)}}
function fmt(ms){var s=Math.ceil(ms/1000),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function openBreeding(phase,ctx){var ph=CARE_PHASES[phase];var meters=Object.keys(ctx.scores).map(function(k){return '<div class="meter-cell"><b>'+TEMPER[k].name+'</b><strong>'+ctx.scores[k]+'</strong></div>'}).join('');var options=ph.options.map(function(o,i){return '<button class="care-card" data-care="'+i+'"><span class="ci">'+o.icon+'</span><b>'+o.name+'</b><small>'+o.desc+'</small><em>偏向 '+TEMPER[o.key].name+(o.mutation?' · 变异 +'+o.mutation:'')+'</em></button>'}).join('');modal.innerHTML='<div class="modal-wrap"><div class="modal-card"><div class="breed-head"><div><span class="eyebrow">三阶段育种 · '+(phase+1)+'/3</span><h2>'+ph.name+'</h2></div><button class="btn ghost" data-close>退出</button></div><div class="phase-dots">'+[0,1,2].map(function(i){return '<i class="'+(i<=phase?'on':'')+'"></i>'}).join('')+'</div><div class="phase-scene"><span class="tag">'+PLANTS[ctx.mother].name+' × '+PLANTS[ctx.donor].name+'</span><p>'+ph.story+'</p></div><div class="care-options">'+options+'</div><div class="care-meter">'+meters+'</div></div></div>';$('[data-close]').onclick=function(){modal.innerHTML=''};$$('[data-care]').forEach(function(b){b.onclick=function(){var o=ph.options[+b.getAttribute('data-care')];ctx.scores[o.key]++;ctx.mutation+=o.mutation||0;ctx.choices.push(o.name);sfx('tap');if(phase<2)openBreeding(phase+1,ctx);else finishBreedingPlan(ctx)}})}
